  <polyline class="ln" points="834.5,286 834.5,318" fill="none" marker-end="url(#ah)"/>
  <rect class="b-work-sh" x="767" y="325" width="145" height="34" rx="6"/>
  <rect class="b-work" x="762" y="320" width="145" height="34" rx="6"/>
