  <text class="t" x="970" y="652" font-size="14">Behavior test</text>
  <text class="s" x="970" y="670">New items spawn and work</text>

  <polyline class="ln fail" points="1072,656 1108,656 1108,444 1080,444" fill="none" marker-end="url(#ah)"/>
  <text class="note fail-t" x="1124" y="550" transform="rotate(-90 1124 550)">Fails: back to the worker; debugger only for new errors</text>

  <polyline class="ln" points="597.5,694 597.5,728" fill="none" marker-end="url(#ah)"/>
