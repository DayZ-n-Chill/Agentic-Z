  <rect class="b-lead" x="920" y="226" width="145" height="60" rx="8"/>
  <text class="t" x="992.5" y="252" font-size="14">Release lead</text>
  <text class="s" x="992.5" y="270">Builds and test runs</text>

  <rect class="band" x="120" y="306" width="955" height="276" rx="12"/>
