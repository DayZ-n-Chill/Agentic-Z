  <text class="t" x="597.5" y="933" font-size="15">You publish</text>

  <polyline class="ln learn" points="477.5,848 116,848 116,142 128,142" fill="none" marker-end="url(#ah)"/>
  <text class="note learn-t" x="130" y="838" text-anchor="start">Your corrections become playbook rules (only with your yes)</text>
 </svg>