  <rect class="b-you" x="477.5" y="820" width="240" height="56" rx="8"/>
  <text class="t" x="597.5" y="844" font-size="15">You (the user)</text>
  <text class="s" x="597.5" y="862">Final yes</text>
  <polyline class="ln" points="597.5,876 597.5,906" fill="none" marker-end="url(#ah)"/>
