  <text class="tw" x="518.5" y="384">Textures</text>

  <polyline class="ln" points="676.5,286 676.5,318" fill="none" marker-end="url(#ah)"/>
  <rect class="b-work-sh" x="609" y="325" width="145" height="34" rx="6"/>
  <rect class="b-work" x="604" y="320" width="145" height="34" rx="6"/>
  <text class="tw" x="676.5" y="342">UI engineer</text>
  <rect class="b-work-sh" x="609" y="367" width="145" height="34" rx="6"/>
