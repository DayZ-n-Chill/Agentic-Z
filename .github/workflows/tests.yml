name: tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml  # pyyaml: docs-sync parses SKILL.md frontmatter
      - run: python -m pytest -q .claude scripts/dev
