name: tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q .claude scripts/dev hooks
      - run: python .claude/skills/docs-sync/sync.py --check  # the wiki lives in its own private repo, so CI has no copy and this reports "no wiki to check"
